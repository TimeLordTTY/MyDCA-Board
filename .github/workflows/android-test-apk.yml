name: Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2
    paths:
      - "android-app/**"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      - name: Prepare artifact metadata
        id: artifact_metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp android-app/app/build/outputs/apk/debug/app-debug.apk artifact/MyDCA-Board-v0.4.1-${GITHUB_SHA::8}.apk
          cd artifact
          sha256sum MyDCA-Board-v0.4.1-${GITHUB_SHA::8}.apk > SHA256SUMS.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "base_url=https://www.timelordtty.cn/"
            echo "variant=debug"
          } > build-metadata.txt
          echo "artifact_name=mydca-android-v0.4.1-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_metadata.outputs.artifact_name }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
